  <script>
    document.querySelectorAll(".carruseles-galeria .carrusel1-galeria-contenedor").forEach((contenedor) => {
      const pista = contenedor.querySelector(".carrusel-pista");
      const diapositivas = pista.querySelectorAll(".galeria-diapositiva");
      let indice = 0;

      window.setInterval(() => {
        indice = (indice + 1) % diapositivas.length;
        pista.scrollTo({
          left: diapositivas[indice].offsetLeft,
          behavior: "smooth"
        });
      }, 4000);
    });
  </script>
